name: factory

# Your 24/7 Faceless Video Factory.
#  Every 15 minutes a "tick" runs: it reads your Telegram commands and, at 7:37 AM, 11:37 AM
#  and 5:37 PM Edmonton time, makes a new video (a missed time is caught up to 3 hours late).
#  Ticks come from GitHub's own timer below AND from the backup timer at cron-job.org.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "make, poll, tick, stats, weekly, report, comments or hindi_test"
        default: "make"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Cache 3D depth model
        uses: actions/cache@v4
        with:
          path: assets/models
          key: midas-small-v21

      - name: Pick task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "t=${{ github.event.inputs.task }}" >> $GITHUB_OUTPUT;
          else echo "t=tick" >> $GITHUB_OUTPUT; fi

      - name: Run factory (${{ steps.task.outputs.t }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YT_REFRESH_TOKEN != '' && format('{{"token":"x","expiry":"2000-01-01T00:00:00Z","refresh_token":"{0}","client_id":"{1}","client_secret":"{2}","token_uri":"https://oauth2.googleapis.com/token","scopes":["https://www.googleapis.com/auth/youtube.upload"]}}', secrets.YT_REFRESH_TOKEN, secrets.YT_CLIENT_ID, secrets.YT_CLIENT_SECRET) || '' }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON_HI: ${{ secrets.HI_YT_REFRESH_TOKEN != '' && format('{{"token":"x","expiry":"2000-01-01T00:00:00Z","refresh_token":"{0}","client_id":"{1}","client_secret":"{2}","token_uri":"https://oauth2.googleapis.com/token","scopes":["https://www.googleapis.com/auth/youtube.upload"]}}', secrets.HI_YT_REFRESH_TOKEN, secrets.YT_CLIENT_ID, secrets.YT_CLIENT_SECRET) || '' }}
          HI_YT_REFRESH_TOKEN: ${{ secrets.HI_YT_REFRESH_TOKEN }}
          HI_META_PAGE_ID: ${{ secrets.HI_META_PAGE_ID }}
          HI_META_PAGE_TOKEN: ${{ secrets.HI_META_PAGE_TOKEN }}
          HI_IG_USER_ID: ${{ secrets.HI_IG_USER_ID }}
          HI_CHANNEL_NAME: ${{ vars.HI_CHANNEL_NAME }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m factory.cloud ${{ steps.task.outputs.t }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "video-factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add data/cloud_state.json data/used_scripts.json data/viewer_questions.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "factory: update state" && git pull --rebase && git push
          fi
